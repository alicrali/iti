<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Online</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main {
      background: var(--card);
      border-radius: 16px;
      padding: 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--ok);
      background: rgba(34, 197, 94, 0.12);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px; height: 8px;
      background: var(--ok);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    p.lead { color: var(--muted); margin-bottom: 28px; line-height: 1.5; }
    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 20px;
      font-size: 0.95rem;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      padding-top: 20px;
    }
    dt { color: var(--muted); }
    dd { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--accent); word-break: break-all; }
    footer { margin-top: 28px; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot"></span> Online</div>
    <h1>Your web server is running</h1>
    <p class="lead">This page is being served successfully. Replace this file with your own content to get started.</p>
    <dl>
      <dt>Host</dt><dd id="host">-</dd>
      <dt>Protocol</dt><dd id="proto">-</dd>
      <dt>Path</dt><dd id="path">-</dd>
      <dt>Local time</dt><dd id="time">-</dd>
    </dl>
    <footer>index.html</footer>
  </main>

  <script>
    document.getElementById('host').textContent = location.host || 'local file';
    document.getElementById('proto').textContent = location.protocol.replace(':', '');
    document.getElementById('path').textContent = location.pathname;
    function tick() {
      document.getElementById('time').textContent = new Date().toLocaleString();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
